name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    uses: johnhenry/workflows/.github/workflows/ci.yml@v1
    with:
      node-versions: '["26"]'
      os: '["ubuntu-latest"]'
      gate-commands: |
        npm test
        npm run typecheck
        npm run examples

  workflow-lint:
    uses: johnhenry/workflows/.github/workflows/workflow-lint.yml@v1
